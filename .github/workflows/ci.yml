name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-extension:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile ytm_like.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check browser-extension/background.js
      - run: node --check browser-extension/reporter.js
      - run: node --check browser-extension/options.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: wear-diagnostic
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-session-bridge-debug
          path: wear-diagnostic/app/build/outputs/apk/debug/app-debug.apk
